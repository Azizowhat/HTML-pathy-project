<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التواصل</title>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Firjar:wght@100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<body>
<main>
    <form method="get">
  <p>
    <label for="name">الاسم</label>
    <input type="text" id="name" name="name" required>
  </p>
  <p>
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" required>
  </p>
  <p>
    <label for="track">سبب التواصل</label>
    <select id="track" name="track">
      <option value="complaint">شكوى</option>
      <option value="suggestion">إقتراح</option>
    </select>
  </p>
  <p>
    <label for="message">رسالتك</label>
    <textarea id="message" name="message" rows="4" minlength="20"></textarea>
  </p>
  <button type="submit">إرسال</button>
</form>
</main>
